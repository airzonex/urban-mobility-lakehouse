connector.name=iceberg
iceberg.catalog.type=jdbc

iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=${ENV:CATALOG_JDBC_URL}
iceberg.jdbc-catalog.connection-user=${ENV:CATALOG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:CATALOG_PASSWORD}
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.default-warehouse-dir=${ENV:ICEBERG_WAREHOUSE}
iceberg.jdbc-catalog.schema-version=V1

fs.s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}