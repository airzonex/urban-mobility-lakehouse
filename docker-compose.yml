x-spark: &spark
  image: urban-mobility-spark:0.1.0
  build:
    context: .
    dockerfile: docker/spark/Dockerfile

  environment:
    PYSPARK_PYTHON: python3
    SPARK_LOCAL_IP: 127.0.0.1

    CATALOG_JDBC_URL: jdbc:postgresql://postgres:5432/${CATALOG_DB:?Set CATALOG_DB in .env}
    CATALOG_USER: ${CATALOG_USER:?Set CATALOG_USER in .env}
    CATALOG_PASSWORD: ${CATALOG_PASSWORD:?Set CATALOG_PASSWORD in .env}

    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    AWS_REGION: ${MINIO_REGION:?Set MINIO_REGION in .env}
    AWS_EC2_METADATA_DISABLED: "true"

    S3_ENDPOINT: http://minio:9000
    ICEBERG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET:?Set MINIO_WAREHOUSE_BUCKET in .env}

  mem_limit: 2g
  cpus: 2

x-airflow: &airflow
  image: urban-mobility-airflow:0.1.0
  build:
    context: ./docker/airflow

  user: "${AIRFLOW_UID:?Set AIRFLOW_UID in .env}:0"

  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres:5432/${AIRFLOW_DB:?Set AIRFLOW_DB in .env}

    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}

    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json

  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config

  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${CATALOG_DB:?Set CATALOG_DB in .env}
      POSTGRES_USER: ${CATALOG_USER:?Set CATALOG_USER in .env}
      POSTGRES_PASSWORD: ${CATALOG_PASSWORD:?Set CATALOG_PASSWORD in .env}
    
    ports:
      - "127.0.0.1:${CATALOG_HOST_PORT:?Set CATALOG_HOST_PORT in .env}:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    
    mem_limit: 512m

  minio:
    image: chainguard/minio:latest@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510
    command: server /data --console-address :9001

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"

    volumes:
     - minio_data:/data

    mem_limit: 1g

  minio-init:
    image: chainguard/minio-client:latest-dev@sha256:0f20f9b9a9a06e2ada88afda965b824fd2d77793083b3b2b10186a9502c836f4
    depends_on:
      minio:
        condition: service_started

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_WAREHOUSE_BUCKET: ${MINIO_WAREHOUSE_BUCKET:?Set MINIO_WAREHOUSE_BUCKET in .env}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:?Set MINIO_RAW_BUCKET in .env}

    entrypoint: [/bin/sh, -ec]

    command:
      - |
        attempt=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc ready local; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then echo "MinIO readiness timeout" >&2; exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_RAW_BUCKET"
        mc mb --ignore-existing "local/$$MINIO_WAREHOUSE_BUCKET"

    mem_limit: 256m

  catalog-init:
    <<: *spark
    command: [/opt/jobs/init_catalog.py]

    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  spark:
    <<: *spark
    profiles: [tools]

    depends_on:
      catalog-init:
        condition: service_completed_successfully
    
    command: [/opt/jobs/iceberg_smoke.py]
    
  trino:
    image: trinodb/trino:484
    restart: unless-stopped

    environment:
      CATALOG_JDBC_URL: jdbc:postgresql://postgres:5432/${CATALOG_DB:?Set CATALOG_DB in .env}
      CATALOG_USER: ${CATALOG_USER:?Set CATALOG_USER in .env}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:?Set CATALOG_PASSWORD in .env}

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AWS_REGION: ${MINIO_REGION:?Set MINIO_REGION in .env}

      S3_ENDPOINT: http://minio:9000
      ICEBERG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET:?Set MINIO_WAREHOUSE_BUCKET in .env}

    ports:
      - "127.0.0.1:${TRINO_PORT:-18080}:8080"

    volumes:
      - ./docker/trino/catalog/lakehouse.properties:/etc/trino/catalog/lakehouse.properties:ro
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
    
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    
    healthcheck:
      test:
        - CMD
        - trino
        - --server
        - http://localhost:8080
        - --execute
        - SELECT 1
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 30
    
    mem_limit: 2g
    cpus: 2

  ingestion:
    image: urban-mobility-ingestion:0.1.0
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    profiles: ["jobs"]
    environment:
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION: ${MINIO_REGION:?Set MINIO_REGION in .env}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:?Set MINIO_RAW_BUCKET in .env}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  airflow-postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AIRFLOW_DB:?Set AIRFLOW_DB in .env}
      POSTGRES_USER: ${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10

    mem_limit: 512m

  airflow-init:
    <<: *airflow
    profiles: ["tools"]
    command: ["db", "migrate"]
    restart: "no"

  airflow-api-server:
    <<: *airflow
    command: ["api-server", "--workers", "1"]
    restart: unless-stopped

    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-18081}:8080"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/version
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    restart: unless-stopped

    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env}"

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type SchedulerJob --hostname "$$HOSTNAME"'
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type DagProcessorJob --hostname "$$HOSTNAME"'
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  airflow_postgres_data:

networks:
  default:
    name: urban-mobility-network