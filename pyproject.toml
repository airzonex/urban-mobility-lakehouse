[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "urban-mobility-lakehouse"
version = "0.1.0"
description = "Urban mobility analytics lakehouse"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pyspark==4.1.3",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]